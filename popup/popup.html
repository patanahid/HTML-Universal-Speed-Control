<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>Speed Controller</title>
</head>

<body>
  <div class="container">
    <h2>Speed Controller</h2>

    <div id="autoSpeedButton" class="auto-speed-button">
      <button type="button" class="speed-btn auto-trigger-btn">
        <span class="auto-status">Auto: Off</span>
        <span class="auto-speed"></span>
      </button>
      <div class="speed-status center">
        <div class="status-line">
          <span class="status-label">Current:</span>
          <span id="currentSpeedStatus">1x</span>
        </div>
        <div class="status-line">
          <span class="status-label">Saved:</span>
          <span id="savedSpeedStatus">None</span>
        </div>
        <div class="status-hint">Click auto-speed to save current speed</div>
      </div>
    </div>

    <div id="feedback" class="feedback" hidden></div>

    <div id="speedButtons" class="speed-buttons"></div>
    <p class="center">You can add or remove presets in the settings.</p>

    <div class="toggles">
      <div class="toggle-item">
        <label><input type="checkbox" id="setIntervalToggle" checked> setInterval</label>
      </div>
      <div class="toggle-item">
        <label><input type="checkbox" id="setTimeoutToggle" checked> setTimeout</label>
      </div>
      <div class="toggle-item">
        <label><input type="checkbox" id="performanceToggle" checked> performance</label>
      </div>
      <div class="toggle-item">
        <label><input type="checkbox" id="dateNowToggle" checked> Date.now</label>
      </div>
      <div class="toggle-item">
        <label><input type="checkbox" id="requestAnimationFrameToggle"> requestAnimationFrame</label>
      </div>
      <div class="toggle-item">
        <label><input type="checkbox" id="autoClickToggle"> Auto-click close buttons</label>
      </div>
    </div>

    <p>Add custom domains in the settings.</p>
    <div class="buttons">
      <button type="button" id="optionsButton">Settings</button>
    </div>
  </div>

  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>

</html>
